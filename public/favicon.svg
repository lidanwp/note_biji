<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Warm beige paper (left side) -->
  <rect x="6" y="8" width="44" height="48"
        rx="2.5" ry="2.5"
        fill="#FEF3C7"
        stroke="#B45309"
        stroke-width="2"/>
  <!-- Subtle text lines -->
  <line x1="12" y1="18" x2="44" y2="18" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="12" y1="26" x2="44" y2="26" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="12" y1="34" x2="44" y2="34" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="12" y1="42" x2="36" y2="42" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="12" y1="50" x2="28" y2="50" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Small yellow pencil with pink eraser, angled from top-right to bottom-left, tip pointing down-left, touching paper -->
  <g transform="rotate(-135 40 32)">
    <!-- Pink eraser (top end) -->
    <rect x="35" y="-6" width="10" height="5" rx="1.5" ry="1.5" fill="#F472B6"/>
    <!-- Silver ferrule -->
    <rect x="35" y="-1" width="10" height="3" fill="#D1D5DB"/>
    <!-- Yellow pencil body -->
    <rect x="36" y="2" width="8" height="24" fill="#FBBF24"/>
    <!-- Wood tip cone -->
    <polygon points="36,26 44,26 40,34" fill="#FCD9A6"/>
    <!-- Graphite tip (touches paper) -->
    <polygon points="38.5,31 41.5,31 40,34" fill="#4B5563"/>
  </g>
</svg>
