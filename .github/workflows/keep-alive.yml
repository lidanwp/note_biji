name: keep-alive

# 作用：定期访问 /api/notes?mode=ping，重置 Supabase 免费版「7 天低活动即暂停」的计时。
#
# 为什么探针挂在 /api/notes 而不是独立端点：
#   Vercel Hobby 计划限制「每个部署最多 12 个 Serverless Functions」，
#   本项目在 api/ 下本来正好是 12 个（_lib 不计入）。先前新增 api/health.js
#   变成第 13 个，部署被直接拒绝（exceeded_serverless_functions_per_deployment），
#   于是把探针改成 notes.js 里的 ?mode=ping 分支——不占函数名额。
#
# 为什么不用 Vercel Cron：
#   Hobby 计划的 cron 只允许「每天一次」，而 Supabase 官方口径是「过去一周里
#   每天有几次数据库请求」才算活动充分；且 cron 触发时间有 ±59 分钟抖动。
#   本 workflow 每 3 小时跑一次，公开仓库的 Actions 分钟数不计量，更稳也更可控。
#
# 说明：探针是 /api/notes?mode=ping，与 notes 的公开 GET 一样不做鉴权，
# 只返回 ok 与延迟、不含业务数据，因此无需配置任何 secret。

on:
  schedule:
    # 每 3 小时一次（UTC），一天 8 次。避开整点：GitHub 整点排队的任务最多，容易延迟。
    - cron: '17 */3 * * *'
  workflow_dispatch: # 支持在 Actions 页面手动点一次

# 避免上一轮没跑完就叠加下一轮
concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping keep-alive probe
        env:
          URL: https://bdxxg.asia/api/notes?mode=ping
        run: |
          set -uo pipefail
          # _t 随机参数用于穿透 CDN 缓存（vercel.json 给 /api/notes 配了 s-maxage=30）
          code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' \
            --max-time 25 --retry 2 --retry-delay 5 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            "${URL}&_t=$(date +%s)")
          echo "HTTP $code"
          echo "--- body ---"
          cat /tmp/probe.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::保活请求失败，HTTP $code"
            exit 1
          fi
