name: keep-alive

# 作用：定期访问 /api/health，重置 Supabase 免费版「7 天低活动即暂停」的计时。
#
# 为什么不用 Vercel Cron：
#   本项目在 vercel.json 里加过 crons 字段（/api/health，0 3 * * *），
#   Vercel 侧直接判部署失败（GitHub commit status = failure，发生在构建前的
#   配置校验阶段，12 秒即失败）。既然 Hobby 计划本来也限制为「每天最多一次」，
#   而 Supabase 要求的是「每天几次数据库请求」，干脆完全交给本 workflow：
#   公开仓库的 Actions 分钟数不计量，跑得比 Vercel cron 更勤也更可控。
#
# 若后端配置了 CRON_SECRET 环境变量，请在仓库 Settings → Secrets → Actions
# 里加一个同名 secret，否则请求会被 401 拒绝。

on:
  schedule:
    # 每 3 小时一次（UTC），一天 8 次。避开整点：GitHub 整点排队的任务最多，容易延迟。
    - cron: '17 */3 * * *'
  workflow_dispatch: # 支持在 Actions 页面手动点一次

# 避免上一轮没跑完就叠加下一轮
concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          URL: https://bdxxg.asia/api/health
          # 未配置该 secret 时为空字符串，后端在未设置 CRON_SECRET 时不做校验
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            --max-time 25 --retry 2 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer ${CRON_SECRET:-}" \
            -H "Cache-Control: no-cache" \
            "$URL")
          echo "HTTP $code"
          echo "--- body ---"
          cat /tmp/health.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::保活请求失败，HTTP $code"
            exit 1
          fi
