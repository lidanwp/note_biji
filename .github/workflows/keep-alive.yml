name: keep-alive

# 作用：定期访问 /api/health，重置 Supabase 免费版「7 天低活动即暂停」的计时。
#
# 为什么不用 Vercel Cron 单独搞定：
#   Vercel Hobby 计划限制 cron 只能「每天一次」，而 Supabase 官方口径是
#   「过去一周里每天有几次数据库请求」才算活动充分。所以这里每 6 小时跑一次，
#   Vercel Cron 作为兜底（vercel.json 的 crons 字段）。
#
# 若后端配置了 CRON_SECRET 环境变量，请在仓库 Settings → Secrets → Actions
# 里加一个同名 secret，否则请求会被 401 拒绝。

on:
  schedule:
    # 每 6 小时一次（UTC）。避开整点：GitHub 整点排队的任务最多，容易延迟。
    - cron: '7 */6 * * *'
  workflow_dispatch: # 支持在 Actions 页面手动点一次

# 避免上一轮没跑完就叠加下一轮
concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          URL: https://bdxxg.asia/api/health
          # 未配置该 secret 时为空字符串，后端在未设置 CRON_SECRET 时不做校验
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            --max-time 25 --retry 2 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer ${CRON_SECRET:-}" \
            -H "Cache-Control: no-cache" \
            "$URL")
          echo "HTTP $code"
          echo "--- body ---"
          cat /tmp/health.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::保活请求失败，HTTP $code"
            exit 1
          fi
